<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism - Messages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="message.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <img src="./img/prsime.webp" width="28" alt="Logo">
            Prism
        </div>
        <ul class="nav-links">
            <li class="active"><a href="#"><i class="fa-regular fa-message"></i> Messages</a></li>
            <li><a href="#"><i class="fas fa-play-circle"></i> Reel</a></li>
            <li><a href="#"><i class="fas fa-users"></i> Forum</a></li>
            <li><a href="#"><i class="fas fa-chart-line"></i> Trading</a></li>
            <li><a href="#"><i class="fas fa-shopping-bag"></i> Shopping</a></li>
            <li><a href="#"><i class="fa-solid fa-play"></i> Video</a></li>
        </ul>
        <div class="add-modules">
            <i class="fas fa-plus-square"></i> Add modules
        </div>
    </div>

    <div class="main-content">
        <header>
            <h1>Messages</h1>
            <div class="header-icons">
                <div class="icon-btn"><i class="far fa-user-circle"></i></div>
                <div class="icon-btn"><i class="fas fa-cog"></i></div>
                <div class="icon-btn">
                    <i class="fas fa-bell"></i>
                    <div class="badge">5</div>
                </div>
            </div>
        </header>

        <div class="messaging-container">
            <div class="contacts-sidebar">
                <div class="contact-item">personne 1</div>
                <div class="contact-item active-user">personne 2</div>
                <div class="contact-item">personne 3</div>
                <div class="contact-item">personne 4</div>
                <div class="contact-item">personne 5</div>
                <div class="contact-item">personne 6</div>
                <div class="contact-item">personne 7</div>
            </div>

            <div class="chat-area">
                <div class="chat-user-header">
                    <i class="far fa-user-circle"></i> personne 2
                </div>

                <div class="messages-display">
                    <div class="bubble sent large"></div>
                    <div class="bubble received small"></div>
                    <div class="bubble sent medium"></div>
                    <div class="bubble received extra-large"></div>
                </div>

                <div class="chat-input-bar">
                    <div class="input-icon"><i class="fas fa-plus-circle"></i></div>
                    <input type="text" placeholder="Votre message...">
                    <div class="input-icon"><i class="fas fa-paper-plane"></i></div>
                    <div class="input-icon"><i class="fas fa-microphone"></i></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
