<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism Profil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./profil.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <div><img src="./img/prsime.webp" width="28px" alt=""></div>
            Prism
        </div>

        <ul class="nav-links">
            <li><a href="#"><i class="fa-regular fa-message"></i> Message</a></li>
            <li><a href="#"><i class="fas fa-play-circle"></i> Reel</a></li>
            <li><a href="#"><i class="fas fa-users"></i> Forum</a></li>
            <li><a href="#"><i class="fas fa-chart-line"></i> Trading</a></li>
            <li><a href="#"><i class="fas fa-shopping-bag"></i> Shopping</a></li>
            <li><a href="#"><i class="fa-solid fa-play"></i> Video</a></li>
        </ul>

        <div class="add-modules">
            <i class="fas fa-plus-square"></i> Add modules
        </div>
    </div>

    <div class="main-content">
        
        <header>
            <h1>Profil</h1>
            <div class="header-icons">
                <div class="icon-btn"><i class="far fa-user-circle"></i></div>
                <div class="icon-btn"><i class="fas fa-cog"></i></div>
                <div class="icon-btn">
                    <i class="fas fa-bell"></i>
                    <div class="badge">5</div>
                </div>
            </div>
        </header>

        <div class="profil-section">
            <div class="profil-container">
                <div class="profil"></div>
                <button class="btn-edit">EDIT</button>
            </div>

            <div class="profil-details">
                <div class="profil-text">
                    <div class="username-u">Username</div>
                    <div class="stats-box">
                        <span><strong>2</strong> publication</span>
                        <span><strong>100</strong> followers</span>
                        <span><strong>154</strong> suivi(e)s</span>
                    </div>
                </div>
                
                <div class="camera-wrapper">
                    <i class="fas fa-camera camera-icon"></i>
                </div>
            </div>
        </div>

        <div class="gallery-section">
            <div class="photo-grid">
                <div class="photo-galery">
                    <img src="/img/vac.jpg">
                </div>
                <div class="photo-galery">
                    <img src="/img/vac2.jpg">
                </div>
            </div>
        </div>

    </div>

</body>
</html>
