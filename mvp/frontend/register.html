<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Connection.css">
    <title>Register</title>
</head>

<header>
    <h1>Register</h1>
</header>

<body>
    <div class="container-form">
        <form id="register-form">
            <input type="text" id="username" placeholder="Username" required>
            <br>
            <input type="email" id="email" placeholder="Email address" required>
            <br>
            <input type="password" id="password" placeholder="Password" required>
            <br>
            <input type="password" id="confirmation_password" placeholder="Confirm password" required>
            <br>

            <button type="submit" class="login-btn">Sign up</button>
            <p class="p">
                Already have an account?
                <a href="./login.html" class="sign-a">Login</a>
            </p>
        </form>
    </div>

    <script>
        const API_URL = "http://localhost:5000";

        document.querySelector('#register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.querySelector('#username').value;
            const email = document.querySelector('#email').value;
            const password = document.querySelector('#password').value;
            const confirmation_password = document.querySelector('#confirmation_password').value;

            if (password !== confirmation_password) {
                alert("Passwords don't match");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        username,
                        password,
                        confirmation_password
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'parametre.html';
                } else {
                    alert(data.msg || "Registration failed");
                }
            } catch (err) {
                alert("Server unreachable");
            }
        });
    </script>

</body>
</html>
