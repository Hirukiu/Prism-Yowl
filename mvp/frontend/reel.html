<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism Reel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="reel.css">
</head>

<body>

    <div class="sidebar">
        <div class="logo">
            <div><img src="./img/prsime.webp" width="28px" alt=""></div>
            Prism
        </div>

        <ul class="nav-links">
            <li><a href="./message.html"><i class="fa-regular fa-message"></i> Message</a></li>
            <li><a href="#"><i class="fas fa-play-circle"></i> Reel</a></li>
            <li><a href="#"><i class="fas fa-users"></i> Forum</a></li>
            <li><a href="#"><i class="fas fa-chart-line"></i> Trading</a></li>
            <li><a href="#"><i class="fas fa-shopping-bag"></i> Shopping</a></li>
            <li><a href="#"><i class="fa-solid fa-play"></i> Video</a></li>
        </ul>

        <div class="add-modules">
            <i class="fas fa-plus-square"></i> Add modules
        </div>
    </div>

    <div class="main-content">

        <header>
            <h1>Reel</h1>
            <div class="header-icons">
                <div class="icon-btn"><i class="far fa-user-circle"></i></div>
                <div class="icon-btn"><i class="fas fa-cog"></i></div>
                <div class="icon-btn">
                    <i class="fas fa-bell"></i>
                 
                </div>
            </div>
        </header>

        <div class="reel-container">

            <div class="reel-video-wrapper">
                <div class="video-placeholder">
                    <div class="video-overlay-text">
                        <div class="user-pill-subscribe">
                            <div class="mini-avatar"></div>
                            <button class="btn-subscribe">Subscribe</button>
                        </div>
                        <p class="reel-desc">Description dans la bio ...</p>
                    </div>
                </div>

                <div class="reel-side-actions">
                    <div class="action-item"><i class="fa-regular fa-thumbs-up"></i></div>
                    <div class="action-item"><i class="fa-regular fa-comment"></i></div>
                    <div class="action-item"><i class="fa-solid fa-share"></i></div>
                    <div class="action-item"><i class="fa-solid fa-ellipsis"></i></div>
                    <div class="music-note-box"></div>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
