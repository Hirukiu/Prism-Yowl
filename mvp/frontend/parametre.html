<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism - Paramètres</title>
    <link rel="stylesheet" href="parametre.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="layout-principal">
    <div class="colone-left">
        <div class="logo">Prism</div>

    <div class="sidebar">
        <div class="logo">
            <div><img src="./img/prsime.webp" width="28px" alt=""></div>
            Prism
        </div>

        <ul class="nav-links">
            <li><a href="./message-3.html"><i class="fa-regular fa-message"></i> Messages</a></li>
            <li><a href="./reel.html"><i class="fas fa-play-circle"></i> Reel</a></li>
            <li><a href="./Inexistant.html"><i class="fas fa-users"></i> Forum</a></li>
            <li><a href="./Inexistant.html"><i class="fas fa-chart-line"></i> Trading</a></li>
            <li><a href="./Inexistant.html"><i class="fas fa-shopping-bag"></i> Shopping</a></li>
            <li><a href="./Inexistant.html"><i class="fa-solid fa-play"></i> Video</a></li>
            <li><a href="./Inexistant.html"><i class="fas fa-gamepad"></i> Jeux</a></li>
        </ul>

        <div class="add-modules">
            <i class="fas fa-plus-square"></i> Add modules
        </div>
    </div>

    <div class="main-content">

        <header>
            <h1>Paramètres</h1>
            <div class="header-icons">
                <div class="icon-btn"><a href="./profil-edit.html"><i class="far fa-user-circle"></i></a></div>
                <div class="icon-btn"><a href="./parametre.html"><i class="fas fa-cog"></i></a></div>
                <div class="icon-btn">
                    <i class="fas fa-bell"></i>
                </div>
            </div>
        </header>

        <div class="settings-container">

            <div class="settings-menu">
                <div class="settings-menu-item">Modules</div>
                <div class="settings-menu-item">Création</div>
                <div class="settings-menu-item">Apparence</div>
                <div class="settings-menu-item">Son</div>
                <div class="settings-menu-item">Confidentialité</div>
                <div class="settings-menu-item">Activité</div>
                <div class="settings-menu-item">Autorisation</div>
                <div class="settings-menu-item">Autres</div>
            </div>

            <div class="settings-panel">
                <h2>Paramètres de modules</h2>

                <div class="module-list">

                    <div class="module-card" data-module="messages">
                        <div class="module-info">
                            <div class="module-icon"><i class="fa-regular fa-message"></i></div>
                            <div class="module-name">Messages</div>
                        </div>
                        <div class="module-controls">
                            <span class="status-text">Actif</span>
                            <label class="switch">
                                <input type="checkbox" class="module-toggle" checked>
                                <span class="slider"></span>
                            </label>
                            <i class="fa-solid fa-bars menu-dots"></i>
                        </div>
                    </div>

                    <div class="module-card" data-module="reel">
                        <div class="module-info">
                            <div class="module-icon"><i class="fas fa-play-circle"></i></div>
                            <div class="module-name">Reel</div>
                        </div>
                        <div class="module-controls">
                            <span class="status-text">Actif</span>
                            <label class="switch">
                                <input type="checkbox" class="module-toggle" checked>
                                <span class="slider"></span>
                            </label>
                            <i class="fa-solid fa-bars menu-dots"></i>
                        </div>
                    </div>

                    <div class="module-card" data-module="forum">
                        <div class="module-info">
                            <div class="module-icon"><i class="fas fa-users"></i></div>
                            <div class="module-name">Forum</div>
                        </div>
                        <div class="module-controls">
                            <span class="status-text">Actif</span>
                            <label class="switch">
                                <input type="checkbox" class="module-toggle" checked>
                                <span class="slider"></span>
                            </label>
                            <i class="fa-solid fa-bars menu-dots"></i>
                        </div>
                    </div>

                    <div class="module-card" data-module="jeux">
                        <div class="module-info">
                            <div class="module-icon"><i class="fas fa-gamepad"></i></div>
                            <div class="module-name">Jeux</div>
                        </div>
                        <div class="module-controls">
                            <span class="status-text">Actif</span>
                            <label class="switch">
                                <input type="checkbox" class="module-toggle" checked>
                                <span class="slider"></span>
                            </label>
                            <i class="fa-solid fa-bars menu-dots"></i>
                        </div>
                    </div>

                    <div class="module-card" data-module="trading">
                        <div class="module-info">
                            <div class="module-icon"><i class="fas fa-chart-line"></i></div>
                            <div class="module-name">Trading</div>
                        </div>
                        <div class="module-controls">
                            <span class="status-text">Actif</span>
                            <label class="switch">
                                <input type="checkbox" class="module-toggle" checked>
                                <span class="slider"></span>
                            </label>
                            <i class="fa-solid fa-bars menu-dots"></i>
                        </div>
                    </div>

                    <div class="module-card" data-module="shopping">
                        <div class="module-info">
                            <div class="module-icon"><i class="fas fa-shopping-bag"></i></div>
                            <div class="module-name">Shopping</div>
                        </div>
                        <div class="module-controls">
                            <span class="status-text">Actif</span>
                            <label class="switch">
                                <input type="checkbox" class="module-toggle" checked>
                                <span class="slider"></span>
                            </label>
                            <i class="fa-solid fa-bars menu-dots"></i>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <script src="modules.js" defer></script>

</body>
</html>
